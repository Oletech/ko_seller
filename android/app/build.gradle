plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'dev.flutter.flutter-gradle-plugin'
    // Generates the native Firebase resources from google-services.json. Phone
    // auth app verification runs in the native SDK, so it has to resolve the
    // seller entry (tz.co.oletech.kariakoonlineseller), not the buyer one.
    id 'com.google.gms.google-services'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// Release signing credentials. Never committed; see android/key.properties.example.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader('UTF-8') { reader ->
        keystoreProperties.load(reader)
    }
}

// Resolve the keystore once, here, so that a missing file or a typo in
// key.properties is visible at configuration time instead of silently
// producing a debug-signed bundle that Play then rejects on upload.
def releaseKeystoreFile = null
def keystoreWarning = 'android/key.properties was not found.'
if (keystorePropertiesFile.exists()) {
    def declaredPath = keystoreProperties['storeFile']
    if (!declaredPath) {
        keystoreWarning = 'android/key.properties has no storeFile entry.'
    } else {
        // Relative paths resolve against android/app/, where this file lives.
        def candidate = file(declaredPath)
        def missingFields = ['storePassword', 'keyAlias', 'keyPassword']
            .findAll { !keystoreProperties[it] }
        if (!candidate.exists()) {
            keystoreWarning = 'Keystore not found at ' + candidate.absolutePath + '.'
        } else if (missingFields) {
            keystoreWarning = 'android/key.properties is missing: ' +
                missingFields.join(', ') + '.'
        } else {
            releaseKeystoreFile = candidate
        }
    }
}
def hasReleaseKeystore = releaseKeystoreFile != null

android {
    namespace "tz.co.oletech.kariakoonlineseller"
    compileSdkVersion 36
    ndkVersion "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += [
            '-Xjvm-default=all'  // Important for Kotlin/Java interop
        ]
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "tz.co.oletech.kariakoonlineseller"
        minSdkVersion flutter.minSdkVersion
        // Google Play requires API 36 for new apps and updates.
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                storeFile releaseKeystoreFile
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // Play rejects debug-signed uploads. The debug key is only a
            // fallback so `flutter run --release` still works on a machine
            // without the upload keystore; a bundle built that way must never
            // be uploaded, so the build says so loudly.
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
                gradle.taskGraph.whenReady { graph ->
                    if (graph.allTasks.any { it.name.toLowerCase().contains('release') }) {
                        logger.warn('')
                        logger.warn('=======================================================')
                        logger.warn(' WARNING: signing this RELEASE build with the DEBUG key.')
                        logger.warn(' ' + keystoreWarning)
                        logger.warn(' Google Play will reject the resulting artifact.')
                        logger.warn('=======================================================')
                        logger.warn('')
                    }
                }
            }
            // Code shrinking is deliberately off. Turning it on stripped the
            // native side of the Firebase plugins, and the app died at
            // startup with "Unable to establish connection on channel" from
            // FirebaseCoreHostApi.initializeCore. Flutter's default release
            // build does not shrink either. If it is ever re-enabled it needs
            // keep rules for the plugin and pigeon classes, and an install
            // test on a real release build before shipping.
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"
}
